<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MaxPoint Display — catálogo visual</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090a0c;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}main{height:100vh;width:100vw}.slide{width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding:7vw;gap:3vw;background:radial-gradient(ellipse at 75% 45%,#1c1e23 0%,#090a0c 62%)}.copy{flex:0 0 48%;min-width:0;z-index:2}.eyebrow{color:#9a9da5;font-size:1.3vw;letter-spacing:.21em;font-weight:600}.name{font-size:clamp(38px,6.4vw,116px);line-height:1.03;letter-spacing:-.055em;font-weight:650;margin:2.2vw 0}.detail{font-size:2vw;color:#a8abb3;line-height:1.45}.price{font-size:4.4vw;font-weight:600;letter-spacing:-.035em;margin-top:4vw}.photo{flex:1;min-width:0;height:76vh;display:flex;align-items:center;justify-content:center}.photo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 28px #0008)}.photo.fallback{color:#3b3d44;font-size:8vw}footer{position:fixed;bottom:2.6vw;left:7vw;color:#777a83;font-size:1.15vw;letter-spacing:.015em}.empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:10vw}.empty h1{font-size:5vw;font-weight:550;letter-spacing:-.045em}video{height:100vh;width:100vw;object-fit:contain;background:#000}
</style></head><body><main id="app"></main><script>
'use strict';
const qs=new URLSearchParams(location.search);
const CONFIG={feedUrl:qs.get('feed')||'',refreshMs:120000,slideMs:9000,videos:[]};
const demo=qs.get('demo')==='1'?[{tipo:'equipo',nombre:'iPhone 13',modelo:'iPhone 13',capacidad:'128 GB',color:'Verde',precio:450000,moneda:'ARS',disponible:true},{tipo:'equipo',nombre:'iPhone 16 Pro Max',modelo:'iPhone 16 Pro Max',capacidad:'256 GB',color:'Titanio natural',precio:1450000,moneda:'ARS',disponible:true}]:[];
let items=demo,queue=[],pos=0,timeout,images={};const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parsePrice=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?n:null};
function slug(model){return String(model||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\biphone\s*/g,'iphone-').replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-').replace(/-$/,'')}
function modelOf(p){return p.modelo||p.nombre||''}
function imageOf(p){let key=slug(modelOf(p));return images[key]||null}
function playlist(){const stock=items.filter(x=>x.disponible===true&&parsePrice(x.precio)&&['ARS','USD'].includes(x.moneda));queue=[];const videos=CONFIG.videos.filter(x=>x&&x.url);const len=Math.max(stock.length,videos.length);for(let i=0;i<len;i++){if(stock[i])queue.push({type:'stock',data:stock[i]});if(videos[i])queue.push({type:'video',data:videos[i]})}if(!queue.length)queue=[{type:'empty'}];pos%=queue.length}
function next(){pos=(pos+1)%queue.length;render()}
function render(){clearTimeout(timeout);const entry=queue[pos];if(entry.type==='video'){app.replaceChildren();const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.src=entry.data.url;v.addEventListener('ended',next,{once:true});v.addEventListener('error',next,{once:true});app.append(v);timeout=setTimeout(next,90000);return}if(entry.type==='empty'){app.innerHTML='<section class="empty"><h1>Todo el universo Apple<br>en un solo lugar.</h1></section>';timeout=setTimeout(next,CONFIG.slideMs);return}const p=entry.data;const price=new Intl.NumberFormat('es-AR',{style:'currency',currency:p.moneda,maximumFractionDigits:0}).format(parsePrice(p.precio));const src=imageOf(p);app.innerHTML='<section class="slide"><div class="copy"><div class="eyebrow">DISPONIBLE EN MAXPOINT</div><h1 class="name">'+esc(modelOf(p))+'</h1><div class="detail">'+esc([p.capacidad,p.color,p.categoria].filter(Boolean).join(' · '))+'</div><div class="price">'+esc(price)+'</div></div><div class="photo '+(src?'':'fallback')+'">'+(src?'<img src="'+esc(src)+'" alt="Fotografía de la familia '+esc(modelOf(p))+'" onerror="this.style.display=\'none\'">':'')+'</div></section><footer>Todo el universo Apple en un solo lugar</footer>';timeout=setTimeout(next,CONFIG.slideMs)}
async function refresh(){if(!CONFIG.feedUrl)return;try{const r=await fetch(CONFIG.feedUrl,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!Array.isArray(j.products))throw Error('Formato inválido');items=j.products;playlist();render()}catch(e){console.warn('Conservando catálogo anterior',e)}}
(async()=>{try{const r=await fetch('catalogo-imagenes.json');if(r.ok)images=await r.json()}catch(e){console.warn('Catálogo de imágenes no disponible',e)}playlist();render();refresh();setInterval(refresh,CONFIG.refreshMs)})();
</script></body></html>
