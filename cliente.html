</style></head><body><header class="header"><div class="brand">Max<b>Point</b></div><div class="place">Mercedes, Buenos Aires</div></header><main><section id="loginView" class="login"><div class="login-card"><div class="eyebrow">Mi espacio en MaxPoint</div><h1>Todo sobre tus equipos.</h1><p class="intro">Ingresá el teléfono que dejaste en MaxPoint para consultar tu situación actual.</p><div class="field"><label for="telInput">Número de teléfono</label><input type="tel" id="telInput" placeholder="2324 123456" autocomplete="tel" inputmode="tel"></div><button class="primary full" id="btnBuscar" type="button">Entrar a mi espacio</button><div class="error" id="loginErr" aria-live="polite"></div></div></section><section id="dashView" class="hidden"><div class="wrap" id="dashContent"></div></section></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';import{getFirestore,collection,query,where,getDocs,getDoc,doc}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyCw76jqobNfGKt4aH7ygv4iVz9ZAHxTiko',authDomain:'maxpoint-taller.firebaseapp.com',projectId:'maxpoint-taller',storageBucket:'maxpoint-taller.firebasestorage.app',messagingSenderId:'591043101786',appId:'1:591043101786:web:b18f78627738a22d008463'}),db=getFirestore(app),$=id=>document.getElementById(id);let portalCfg={whatsapp:'',googleReviewUrl:'',ofertas:[],destacados:[]};
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'),num=v=>Number.isFinite(Number(v))?Number(v):0,dinero=v=>'$ '+num(v).toLocaleString('es-AR',{maximumFractionDigits:0});
function fechaValor(v){if(!v)return 0;if(v.toMillis)return v.toMillis();const p=String(v).split('/'),d=p.length===3?new Date(p[2]+'-'+p[1]+'-'+p[0]+'T12:00:00'):new Date(v);return Number.isNaN(d.getTime())?0:d.getTime()}function vigente(x){const h=new Date().toISOString().slice(0,10);return(!x.fechaDesde||x.fechaDesde<=h)&&(!x.fechaHasta||x.fechaHasta>=h)}function variantesTelefono(v){const o=String(v||'').trim(),d=o.replace(/\D/g,'');let l=d;if(/^549\d{10}$/.test(l))l=l.slice(3);else if(/^54\d{10}$/.test(l))l=l.slice(2);if(l.length<8||l.length>11)return[];const a=[o,d,l];if(l.length===10)a.push('54'+l,'549'+l,'+54 '+l,'+54 9 '+l);return[...new Set(a.filter(Boolean))].slice(0,10)}
async function buscarReps(c){const local=c.find(x=>/^\d{8,11}$/.test(x)&&!/^54/.test(x))||c[0],consultas=c.map(t=>getDocs(query(collection(db,'reparaciones'),where('telefono','==',t))));consultas.push(getDocs(query(collection(db,'reparaciones'),where('telefonoClave','==',local))));const ss=await Promise.all(consultas),m=new Map;ss.forEach(s=>s.docs.forEach(d=>m.set(d.id,{id:d.id,...d.data()})));return[...m.values()]}async function cargarCfg(){try{const s=await getDoc(doc(db,'config','portalCliente'));if(s.exists())portalCfg={...portalCfg,...s.data()}}catch(e){console.info('Configuración comercial no disponible')}}
function pagos(r){const vistos=new Set,p=Array.isArray(r.pagos)?r.pagos.filter(x=>{if(!(num(x&&x.monto)>0)||x.estado==='revertido')return false;if(x.pagoId){if(vistos.has(x.pagoId))return false;vistos.add(x.pagoId)}return true}):[];if(p.length)return p;let l=num(r.cobroHistoricoNoConciliado);if(!l&&r.controlComisionV1!==true)l=num(r.sena);return l>0?[{monto:l,legacy:true}]:[]}function sinCargo(r){const x=r.resolucionFinanciera||(r.es_garantia==='si'||r.resultadoServicio==='Garantía / retrabajo'?'sin_cargo_garantia':'cobrable');return['sin_cargo_garantia','sin_cargo_cortesia','no_corresponde'].includes(x)}function finanzas(r){const presupuesto=num(r.presupuesto),pagado=pagos(r).reduce((s,p)=>s+num(p.monto),0);return{presupuesto,pagado,saldo:Math.max(0,presupuesto-pagado),sinCargo:sinCargo(r)}}
function estadoInfo(e){const k=String(e||'Ingresado').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(),m={'ingresado':['Recibimos tu equipo.',''],'en revision':['Estamos revisando tu equipo.',''],'en proceso':['Estamos trabajando en tu equipo.',''],'en taller':['Estamos trabajando en tu equipo.',''],'esperando repuesto':['Estamos esperando el repuesto necesario.',''],'listo':['Tu equipo está listo para retirar.','ready'],'listo para retirar':['Tu equipo está listo para retirar.','ready'],'entregado':['Reparación finalizada.','closed'],'no aprobado':['El presupuesto no fue aprobado.','alert'],'garantia':['Estamos atendiendo tu equipo por garantía.','']},x=m[k]||['Estado actualizado: '+String(e||'Ingresado')+'.',''];return{texto:x[0],clase:x[1],terminal:['entregado','no aprobado'].includes(k),listo:['listo','listo para retirar'].includes(k)}}
function modeloClave(v){let s=String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();const m=s.match(/(?:iphone|iph|ip)\s*(\d{1,2})\s*(pro\s*max|promax|pm|pro|p|max|plus|mini|air)?/i);if(m){let x=String(m[2]||'').replace(/\s+/g,' ').trim();if(['max','pm','promax'].includes(x))x='pro max';if(x==='p')x='pro';return['iphone',Number(m[1]),x].filter(Boolean).join('_').replace(/\s/g,'_')}return s.replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}function waUrl(m){const n=String(portalCfg.whatsapp||'').replace(/\D/g,'');return n?'https://wa.me/'+n+'?text='+encodeURIComponent(m):''}function ctaWa(t,m){const u=waUrl(m);return u?'<a class="wa" target="_blank" rel="noopener" href="'+u+'">'+esc(t)+'</a>':''}function prioridad(r){const e=String(r.estado||'').toLowerCase();if(e.includes('listo'))return 0;if(e.includes('garant'))return 1;if(e.includes('proceso')||e.includes('taller'))return 2;if(e.includes('revision'))return 3;return 4}
function tarjetaRep(r,nombre){const e=estadoInfo(r.estado),f=finanzas(r),eq=[r.equipo,r.capacidad].filter(Boolean).join(' ')||'Tu equipo';let h='<article class="repair"><div class="repair-top"><div><div class="order">'+esc(r.orden||'Orden de reparación')+'</div><div class="device">'+esc(eq)+'</div></div><div class="date">'+esc(r.fecha||'')+'</div></div><div class="status '+e.clase+'">'+esc(r.estado||'Ingresado')+'</div><p class="status-copy">'+esc(e.texto)+'</p>';if(r.falla)h+='<div class="info"><small>Falla informada</small><div>'+esc(r.falla)+'</div></div>';if(r.diagnosticoTaller)h+='<div class="info"><small>Información del taller</small><div>'+esc(r.diagnosticoTaller)+'</div></div>';if(f.sinCargo)h+='<div class="finance"><div class="money-row total"><span>Estado</span><span class="paid">Sin cargo</span></div></div>';else if(f.presupuesto>0)h+='<div class="finance"><div class="money-row"><span>Presupuesto</span><b>'+dinero(f.presupuesto)+'</b></div>'+(f.pagado>0?'<div class="money-row"><span>Total pagado</span><b class="paid">'+dinero(f.pagado)+'</b></div>':'')+'<div class="money-row total"><span>Saldo</span><b class="'+(f.saldo>0?'pending':'paid')+'">'+(f.saldo>0?dinero(f.saldo):'Pagado')+'</b></div></div>';else if(!e.terminal)h+='<div class="finance"><div class="money-row total"><span>Presupuesto</span><span>Pendiente</span></div></div>';const g=r.garantiaTexto||r.garantia||r.garantia_ref;if(g)h+='<div class="warranty">Garantía: '+esc(g)+'</div>';h+='<div class="actions">'+ctaWa(e.listo?'Avisar que voy a retirar':'Consultar por WhatsApp','Hola, soy '+nombre+'. Estoy consultando por mi reparación '+(r.orden||'')+' de '+eq+'.')+'</div></article>';return h}
function tarjetaCom(x,tipo,n){const img=/^https:\/\//i.test(String(x.imagen||''))?x.imagen:'',t=x.titulo||x.nombre||'',m=x.cta||('Hola, soy '+n+'. Vi en mi portal '+t+' y quiero consultar.');let h='<article class="commercial">'+(img?'<img src="'+esc(img)+'" alt="">':'')+'<div class="commercial-body">';if(tipo==='oferta'&&num(x.porcentajeDescuento)>0)h+='<div class="discount">'+num(x.porcentajeDescuento)+'% de descuento</div>';h+='<h3>'+esc(t)+'</h3>'+(x.descripcion?'<p>'+esc(x.descripcion)+'</p>':'');if(tipo==='destacado'&&x.precio!=null)h+='<div class="price">'+dinero(x.precio)+(x.precioAnterior!=null?'<span class="old">'+dinero(x.precioAnterior)+'</span>':'')+'</div>';return h+ctaWa('Consultar',m)+'</div></article>'}
function mostrar(reps){reps.sort((a,b)=>prioridad(a)-prioridad(b)||fechaValor(b.fecha)-fechaValor(a));const nombre=String(reps[0].nombre||'Cliente').trim(),primero=nombre.split(/\s+/)[0]||'Cliente',activas=reps.filter(r=>!estadoInfo(r.estado).terminal),hist=reps.filter(r=>estadoInfo(r.estado).terminal),modelos=[...new Set(reps.map(r=>modeloClave(r.equipo)).filter(Boolean))],ofertas=(portalCfg.ofertas||[]).filter(o=>o.activa!==false&&vigente(o)&&(o.modelosCompatibles||[]).some(m=>modelos.includes(modeloClave(m)))).sort((a,b)=>num(a.prioridad)-num(b.prioridad)),dest=(portalCfg.destacados||[]).filter(x=>x.activo!==false&&vigente(x)).sort((a,b)=>num(a.orden)-num(b.orden));let h='<header class="hello"><div class="eyebrow">Mi espacio en MaxPoint</div><h1>Hola, '+esc(primero)+'</h1><p>'+(activas.length?(activas.length===1?'Tenés una reparación activa.':'Tenés '+activas.length+' reparaciones activas.'):'Tu historial y beneficios, en un solo lugar.')+'</p></header>';if(activas.length)h+='<section class="section"><div class="section-head"><div><div class="eyebrow">Tu situación actual</div><h2>Reparaciones activas</h2></div></div>'+activas.map(r=>tarjetaRep(r,nombre)).join('')+'</section>';else h+='<section class="section"><div class="empty"><b>No tenés reparaciones activas.</b><br>Podés consultar tu historial y beneficios más abajo.</div></section>';const equipos=[...new Set(reps.map(r=>String(r.equipo||'').trim()).filter(Boolean))];if(equipos.length)h+='<section class="section"><div class="section-head"><div><div class="eyebrow">Tus equipos</div><h2>Equipos relacionados</h2></div></div><div class="repair">'+equipos.slice(0,6).map(x=>'<div class="money-row"><span>Equipo</span><b>'+esc(x)+'</b></div>').join('')+'</div></section>';if(hist.length)h+='<section class="section"><details class="history"><summary>Ver historial ('+hist.length+')</summary>'+hist.map(r=>'<div class="history-item"><div><b>'+esc(r.equipo||'Equipo')+'</b><small>'+esc([r.fecha,r.orden].filter(Boolean).join(' · '))+'</small></div><div class="history-state">'+esc(r.estado||'')+'</div></div>').join('')+'</details></section>';if(ofertas.length)h+='<section class="section"><div class="section-head"><div><div class="eyebrow">Recomendado para tu equipo</div><h2>Elegido para vos</h2></div></div><div class="commercial-grid">'+ofertas.map(x=>tarjetaCom(x,'oferta',nombre)).join('')+'</div></section>';if(dest.length)h+='<section class="section"><div class="section-head"><div><div class="eyebrow">Destacados MaxPoint</div><h2>Productos seleccionados</h2></div></div><div class="commercial-grid">'+dest.map(x=>tarjetaCom(x,'destacado',nombre)).join('')+'</div></section>';if(!activas.length&&hist.length&&/^https:\/\//i.test(portalCfg.googleReviewUrl||''))h+='<section class="section review"><h2>¿Cómo fue tu experiencia con MaxPoint?</h2><p>Tu opinión nos ayuda a seguir mejorando.</p><a class="primary" target="_blank" rel="noopener" href="'+esc(portalCfg.googleReviewUrl)+'">Calificarnos en Google</a></section>';h+='<div class="footer">'+ctaWa('¿Necesitás ayuda? Escribinos','Hola, soy '+nombre+'. Necesito ayuda desde mi portal.')+'<p><button class="logout" id="cerrar">Consultar otro teléfono</button></p></div>';$('dashContent').innerHTML=h;$('loginView').classList.add('hidden');$('dashView').classList.remove('hidden');$('cerrar').onclick=cerrar}
async function buscar(){const c=variantesTelefono($('telInput').value);if(!c.length){$('loginErr').textContent='Ingresá un número de teléfono válido.';return}const b=$('btnBuscar');b.disabled=true;b.textContent='Buscando…';$('loginErr').textContent='';try{const[reps]=await Promise.all([buscarReps(c),cargarCfg()]);if(!reps.length){$('loginErr').textContent='No encontramos información asociada a ese teléfono.';return}mostrar(reps)}catch(e){console.error(e);$('loginErr').textContent='No pudimos realizar la consulta. Intentá nuevamente.'}finally{b.disabled=false;b.textContent='Entrar a mi espacio'}}function cerrar(){$('dashView').classList.add('hidden');$('loginView').classList.remove('hidden');$('telInput').value='';$('loginErr').textContent='';$('telInput').focus()}$('btnBuscar').onclick=buscar;$('telInput').onkeydown=e=>{if(e.key==='Enter')buscar()};
