<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MaxPoint Display</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0d11;color:white;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
main{width:100vw;height:100vh}.slide{height:100%;display:flex;align-items:center;justify-content:space-around;padding:7vw;gap:6vw}
.copy{flex:1}.eyebrow{font-size:1.5vw;letter-spacing:.25em;color:#a8b0bb}.name{font-size:8vw;letter-spacing:-.06em;line-height:1.05;margin:3vw 0}.detail{font-size:2.2vw;color:#b7bdc7}.price{font-size:5vw;font-weight:650;margin-top:5vw}.device{flex:1;text-align:center;font-size:18vw;color:#3c4552}
footer{position:absolute;bottom:3vw;left:7vw;color:#929aa5;font-size:1.1vw}video{height:100vh;width:100vw;object-fit:contain;background:#000}
</style></head><body><main id="app"></main><script>
'use strict';
// La fuente remota debe entregar SOLO datos autorizados para exhibición, nunca documentos crudos de Firestore.
const CONFIG={feedUrl:new URLSearchParams(location.search).get('feed') || '',refreshMs:120000,slideMs:9000,videos:[]};
const demo=[];
let items=demo,queue=[],pos=0,timeout;
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parsePrice(value){const n=Number(value);return Number.isFinite(n)&&n>0?n:null}
function playlist(){const stock=items.filter(x=>x.disponible===true&&parsePrice(x.precio)&&['ARS','USD'].includes(x.moneda));const videos=CONFIG.videos.filter(x=>x&&x.url);queue=[];const len=Math.max(stock.length,videos.length);for(let i=0;i<len;i++){if(stock[i])queue.push({type:'stock',data:stock[i]});if(videos[i])queue.push({type:'video',data:videos[i]})}if(!queue.length)queue=[{type:'empty'}];pos%=queue.length}
function next(){pos=(pos+1)%queue.length;render()}
function render(){clearTimeout(timeout);const entry=queue[pos];if(entry.type==='video'){app.replaceChildren();const video=document.createElement('video');video.autoplay=true;video.muted=true;video.playsInline=true;video.src=entry.data.url;video.addEventListener('ended',next,{once:true});video.addEventListener('error',next,{once:true});app.append(video);timeout=setTimeout(next,90000);return}
if(entry.type==='empty'){app.innerHTML='<section class="slide"><h1>Todo el universo Apple en un solo lugar</h1></section>';timeout=setTimeout(next,CONFIG.slideMs);return}
const p=entry.data;const price=new Intl.NumberFormat('es-AR',{style:'currency',currency:p.moneda,maximumFractionDigits:0}).format(parsePrice(p.precio));
app.innerHTML='<section class="slide"><div class="copy"><div class="eyebrow">DISPONIBLE EN MAXPOINT</div><h1 class="name">'+esc(p.nombre||p.modelo)+'</h1><div class="detail">'+esc([p.capacidad,p.color,p.categoria].filter(Boolean).join(' · '))+'</div><div class="price">'+esc(price)+'</div></div><div class="device">◯</div></section><footer>Todo el universo Apple en un solo lugar</footer>';
timeout=setTimeout(next,CONFIG.slideMs)}
async function refresh(){if(!CONFIG.feedUrl)return;try{const res=await fetch(CONFIG.feedUrl,{cache:'no-store'});if(!res.ok)throw Error('Feed HTTP '+res.status);const payload=await res.json();if(!Array.isArray(payload.products))throw Error('Formato inválido');items=payload.products;playlist();render()}catch(err){console.warn('Se conserva el último catálogo',err)}}
playlist();render();setInterval(refresh,CONFIG.refreshMs);refresh();
</script></body></html>
