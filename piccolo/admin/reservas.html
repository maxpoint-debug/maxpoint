<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Piccolo · Reservas</title><link rel="stylesheet" href="admin.css"><style>
